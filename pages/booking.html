<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic document information -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Book a Car | DriveEasy Rentals</title>

    <!-- The CSS file is one folder above the pages folder -->
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <!-- Website header -->
    <header class="site-header">
      <a class="logo" href="../index.html">DriveEasy Rentals</a>

      <!-- Main navigation -->
      <nav aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="cars.html">Cars</a>
        <a href="booking.html">Book a Car</a>
        <a href="locations.html">Locations</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <!-- Booking page introduction -->
      <section class="page-intro">
        <p class="eyebrow">Reserve your vehicle</p>
        <h1>Book your rental car</h1>
        <p>
          Complete the form below to request your vehicle reservation.
        </p>
      </section>

      <!-- Main booking form -->
      <section class="booking-section">
        <form class="booking-form">
          <h2>Rental Information</h2>

          <!-- The label element describes the car selection field -->
          <label for="car-type">Choose a car:</label>

          <!-- The select element creates a dropdown menu -->
          <select id="car-type" name="car-type">
            <option value="toyota-corolla">
              Toyota Corolla - Economy
            </option>
            <option value="toyota-rav4">
              Toyota RAV4 - SUV
            </option>
            <option value="bmw-5-series">
              BMW 5 Series - Luxury
            </option>
            <option value="ford-mustang">
              Ford Mustang - Sports
            </option>
            <option value="tesla-model-3">
              Tesla Model 3 - Electric
            </option>
            <option value="honda-odyssey">
              Honda Odyssey - Van
            </option>
          </select>

          <!-- The label element identifies the pickup location field -->
          <label for="pickup-location">Pickup location:</label>

          <!-- The select element lets the customer choose a location -->
          <select id="pickup-location" name="pickup-location">
            <option value="los-angeles">Los Angeles</option>
            <option value="san-diego">San Diego</option>
            <option value="san-francisco">San Francisco</option>
            <option value="las-vegas">Las Vegas</option>
          </select>

          <!-- The label element identifies the return location field -->
          <label for="return-location">Return location:</label>

          <select id="return-location" name="return-location">
            <option value="los-angeles">Los Angeles</option>
            <option value="san-diego">San Diego</option>
            <option value="san-francisco">San Francisco</option>
            <option value="las-vegas">Las Vegas</option>
          </select>

          <!-- The label element identifies the pickup date field -->
          <label for="pickup-date">Pickup date:</label>

          <input
            id="pickup-date"
            name="pickup-date"
            type="date"
          />

          <!-- The label element identifies the return date field -->
          <label for="return-date">Return date:</label>

          <input
            id="return-date"
            name="return-date"
            type="date"
          />

          <!-- The label element identifies the rental duration field -->
          <label for="rental-days">Number of rental days:</label>

          <!-- The min attribute prevents fewer than one rental day -->
          <input
            id="rental-days"
            name="rental-days"
            type="number"
            min="1"
            placeholder="Enter number of days"
          />

          <h2>Customer Information</h2>

          <!-- The label element identifies the customer name field -->
          <label for="customer-name">Full name:</label>

          <input
            id="customer-name"
            name="customer-name"
            type="text"
            placeholder="Enter your full name"
          />

          <!-- The label element identifies the phone field -->
          <label for="phone">Phone number:</label>

          <!-- The inputmode attribute suggests a phone keyboard on mobile devices -->
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            placeholder="555-123-4567"
          />

          <!-- The label element identifies the license plate field -->
          <label for="license-plate">License plate:</label>

          <!-- The pattern attribute checks the license plate format -->
          <input
            id="license-plate"
            name="license-plate"
            type="text"
            pattern="[A-Z0-9-]+"
            title="Use uppercase letters, numbers, and hyphens"
            placeholder="ABC-1234"
          />

          <!-- The label element identifies the special requests field -->
          <label for="special-requests">Special requests:</label>

          <!-- The textarea element allows multiple lines of text -->
          <textarea
            id="special-requests"
            name="special-requests"
            rows="5"
            placeholder="Enter any special requests"
          ></textarea>

          <!-- Form submission button -->
          <button type="submit">Submit Booking Request</button>
        </form>
      </section>
    </main>

    <!-- Website footer -->
    <footer class="site-footer">
      <p>&copy; 2026 DriveEasy Rentals. All rights reserved.</p>
      <a href="contact.html">Contact us</a>
    </footer>
  </body>
</html>
