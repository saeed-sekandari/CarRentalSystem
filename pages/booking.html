<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>DriveEasy Rentals | Book a Car</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <!-- Website header -->
    <header class="site-header">
      <a class="logo" href="../index.html">DriveEasy Rentals</a>

      <!-- Main navigation -->
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="cars.html">Our Cars</a></li>
          <li><a href="booking.html">Book a Car</a></li>
          <li><a href="locations.html">Locations</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Booking introduction -->
      <section class="page-intro">
        <p class="eyebrow">Reserve your vehicle</p>
        <h1>Book a Car</h1>
        <p>Complete the form below to request your rental vehicle.</p>
      </section>

      <!-- Booking form -->
      <section class="booking-section">
        <form class="booking-form">
          <!-- UNIQUE ELEMENT: label
               Explanation: Provides a visible text description for the user input control -->

          <label for="car-type">Choose a car</label>

          <!-- UNIQUE ELEMENT: select
               Explanation: Creates a dropdown menu so users can choose one option. -->

          <select id="car-type" name="car-type" required>
            <option value="">Select a vehicle</option>
            <option value="toyota-corolla">Toyota Corolla</option>
            <option value="honda-civic">Honda Civic</option>
            <option value="hyundai-elantra">Hyundai Elantra</option>
            <option value="honda-cr-v">Honda CR-V</option>
            <option value="ford-explorer">Ford Explorer</option>
            <option value="bmw-5-series">BMW 5 Series</option>
            <option value="mercedes-e-class">Mercedes E-Class</option>
            <option value="ford-mustang">Ford Mustang</option>
            <option value="chevrolet-corvette">Chevrolet Corvette</option>
            <option value="tesla-model-3">Tesla Model 3</option>
            <option value="tesla-model-y">Tesla Model Y</option>
            <option value="honda-odyssey">Honda Odyssey</option>
            <option value="ford-f-150">Ford F-150</option>
          </select>

          <!-- The label and select elements are also used for pickup location. -->

          <label for="pickup-location">Pickup location</label>

          <select
            id="pickup-location"
            name="pickup-location"
            required
          >
            <option value="">Select a location</option>
            <option value="los-angeles">Los Angeles</option>
            <option value="san-diego">San Diego</option>
            <option value="san-francisco">San Francisco</option>
            <option value="las-vegas">Las Vegas</option>
          </select>

          <!-- Return location allows the customer to return the car
               to a different location from the pickup location. -->

          <label for="return-location">Return location</label>

          <select
            id="return-location"
            name="return-location"
            required
          >
            <option value="">Select a return location</option>
            <option value="los-angeles">Los Angeles</option>
            <option value="san-diego">San Diego</option>
            <option value="san-francisco">San Francisco</option>
            <option value="las-vegas">Las Vegas</option>
          </select>

          <label for="pickup-date">Pickup date</label>
          <input
            type="date"
            id="pickup-date"
            name="pickup-date"
            required
          />

          <label for="return-date">Return date</label>
          <input
            type="date"
            id="return-date"
            name="return-date"
            required
          />

          <label for="rental-days">Number of rental days</label>

          <!-- UNIQUE ATTRIBUTE: min
               Explanation: It sets the smallest number the user is allowed to enter. -->

          <input
            type="number"
            id="rental-days"
            name="rental-days"
            min="1"
            required
          />

          <label for="customer-name">Full name</label>
          <input
            type="text"
            id="customer-name"
            name="customer-name"
            placeholder="Enter your full name"
            required
          />

          <label for="phone">Phone number</label>

          <!-- UNIQUE ATTRIBUTE: inputmode
               Explanation: Helps mobile devices display a phone-friendly keyboard like numbers and symbols. -->

          <input
            type="tel"
            id="phone"
            name="phone"
            inputmode="tel"
            placeholder="555-555-5555"
            required
          />

          <label for="license-plate">License plate</label>

          <!-- UNIQUE ATTRIBUTE: pattern
               Explanation: Controls the format of the license plate(Validate user input).
               Letters, numbers, and hyphens are allowed. -->

          <input
            type="text"
            id="license-plate"
            name="license-plate"
            pattern="[A-Za-z0-9-]+"
            placeholder="ABC-1234"
            required
          />

          <label for="requests">Special requests</label>

          <!-- UNIQUE ELEMENT: textarea
               Explanation: Gives users a larger area or mutltiline text input to type special requests
               , comments and reviews. -->

          <textarea
            id="requests"
            name="requests"
            placeholder="Add any special requests"
          ></textarea>

          <button class="button" type="submit">
            Submit Booking Request
          </button>
        </form>
      </section>
    </main>

    <!-- Website footer -->
    <footer class="site-footer">
      <p>&copy; 2026 DriveEasy Rentals. All rights reserved.</p>
    </footer>
  </body>
</html>
